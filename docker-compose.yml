name: e2m-insights

x-backend-env: &backend-env
  APP_NAME: E2M Insights
  APP_ENV: development
  DEBUG: "false"
  API_V1_PREFIX: /api/v1
  DATABASE_URL: "postgresql+psycopg://csm:${POSTGRES_PASSWORD:-csm_local_password}@postgres:5432/${POSTGRES_DB:-e2m-insights}"
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a unique secret of at least 32 characters}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
  LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  LLM_BASE_URL: "${LLM_BASE_URL:-}"
  LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
  LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
  LLM_JSON_MODE: "${LLM_JSON_MODE:-false}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
  AI_MAX_RETRIES: "2"
  BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
  BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-AdminPass123!}"
  BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-Platform Admin}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-e2m-insights}"
      POSTGRES_USER: csm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-csm_local_password}"
    volumes:
      - e2m-insights-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csm -d ${POSTGRES_DB:-e2m-insights}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - e2m-insights-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - e2m-insights-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - e2m-insights-network

  backend:
    image: e2m-insights-backend
    build:
      context: ./backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - e2m-insights-network

  frontend:
    image: e2m-insights-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - e2m-insights-network

volumes:
  e2m-insights-postgres-data:
  e2m-insights-redis-data:

networks:
  e2m-insights-network:
    name: e2m-insights-network
